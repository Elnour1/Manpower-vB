<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWP System - إنشاء حساب جديد</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .register-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background-color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .alert-msg {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }

    .alert-danger { background-color: #fee2e2; color: #991b1b; }
    .alert-success { background-color: #dcfce7; color: #15803d; }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <div class="header">
      <h2>PWP System</h2>
      <p>إنشاء حساب جديد للمستخدم</p>
    </div>

    <div id="alert-box" class="alert-msg"></div>

    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>الاسم بالكامل</label>
        <input type="text" id="reg-name" placeholder="أدخلي الاسم" required>
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="reg-email" placeholder="example@domain.com" required dir="ltr">
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="reg-password" placeholder="••••••••" required dir="ltr">
      </div>

      <div class="form-group">
        <label>صلاحية المستخدم (Role)</label>
        <select id="reg-role">
          <option value="Admin">مدير نظام (Admin)</option>
          <option value="Supervisor">مشرف إنتاج (Supervisor)</option>
          <option value="Viewer">مستعرض فقط (Viewer)</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">تسجيل الحساب</button>
    </form>

    <div class="footer-text">
      لديك حساب بالفعل؟ <a href="index.html">تسجيل الدخول</a>
    </div>
  </div>

  <script>
    async function handleRegister(event) {
      event.preventDefault();
      
      const alertBox = document.getElementById('alert-box');
      alertBox.style.display = 'none';

      const body = {
        name: document.getElementById('reg-name').value,
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-password').value,
        role: document.getElementById('reg-role').value
      };

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await response.json();

        if (response.ok) {
          alertBox.className = 'alert-msg alert-success';
          alertBox.innerText = 'تم إنشاء الحساب بنجاح! جاري التوجيه...';
          alertBox.style.display = 'block';

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } else {
          alertBox.className = 'alert-msg alert-danger';
          alertBox.innerText = data.error || 'حدث خطأ أثناء التسجيل';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert-msg alert-danger';
        alertBox.innerText = 'تعذر الاتصال بالسيرفر';
        alertBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
